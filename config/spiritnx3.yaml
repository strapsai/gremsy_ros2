# Per-drone config for spiritnx3. Selected by spirit_triage.launch.py from the
# drone name (ROBOT_NAME / launch arg). Applies to spirit_driver and ui_demo_ros2
# (/** matches any node name/namespace).
#
# The *_topic entries are the pre-existing, cross-system interface topics. They
# are ABSOLUTE (leading '/') so they are NOT placed under the /<drone>/gremsy
# namespace -- gimbal_command comes from the basestation, and the bag logs
# gimbal_orientation / move_gimbal_angle at these names.
/**:
  ros__parameters:
    gremsy_ip: "192.168.70.23"
    gremsy_port: 14566
    gimbal_command_topic: "/spiritnx3/gimbal/command"
    gimbal_orientation_topic: "/gimbal_orientation"
    move_gimbal_angle_topic: "/move_gimbal_angle"
    # Control mode asserted before every absolute-angle command. MUST agree with
    # spirit_task_executor's `gimbal_yaw_frame` (config/spiritnx3.yaml), which
    # decides whether the yaw we send is body-relative or a compass heading:
    #   follow <-> gimbal_yaw_frame: body       lock <-> gimbal_yaw_frame: absolute
    # Changing one without the other points the camera at the wrong bearing.
    gimbal_mode: "follow"
    # One send of the wide zoom when the driver starts, so the camera never
    # begins a run at whatever the last one left it in (observed booting at
    # 20x). A range POSITION, not a magnification: 0.0 is true 1x, while 1.0
    # is already 1.2116x. The driver waits for the first EO zoom telemetry
    # before sending, because a camera command issued before the payload's
    # camera subsystem is up is dropped silently. Remove the key to disable.
    boot_zoom_range: 0.0
